<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Location Map — Jedburgh Town Trail</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="trail.css?v=9"><style>#map{height:calc(100vh - 52px)}.static-route-map{padding:16px}.static-route-map img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow)}</style>
</head><body>
<header class="topbar"><a href="locations.html">&larr; Locations</a><h1 id="mapTitle">Location Map</h1><span style="width:52px"></span></header><div id="staticMap" class="shell static-route-map" hidden></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="trail-data.js?v=7"></script><script src="trail-experience.js?v=2"></script><script src="trail-routes.js?v=1"></script>
<script>
const experienceKey=TrailExperience.current(),pins=TrailRoutes.pinsForMode(experienceKey),route=TrailRoutes.forMode(experienceKey),isEssential=TrailRoutes.routeKeyForMode(experienceKey)==='essential';document.getElementById('mapTitle').textContent=isEssential?'Essential Trail Map':'Location Map';
if(isEssential){document.getElementById('map').hidden=true;const staticMap=document.getElementById('staticMap');staticMap.hidden=false;staticMap.innerHTML=`<img src="${route.mapImage}" alt="Map of the Essential Jedburgh Trail and its nine locations">`;}
else{const map=L.map('map').setView([pins[0].lat,pins[0].lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const points=pins.map((pin,index)=>{const point=[pin.lat,pin.lng],marker=L.marker(point,{icon:L.divIcon({className:'leaflet-div-icon',html:`<span>${index+1}</span>`,iconSize:[26,26]})}).addTo(map);marker.bindPopup(`<b>${pin.name}</b><br><a href="location.html?id=${encodeURIComponent(pin.id)}">View details</a>`);return point;});if(points.length)map.fitBounds(L.latLngBounds(points),{padding:[30,30]});if(points.length>1)L.polyline(points,{color:'#235c45',weight:4,opacity:.7,dashArray:'6 8'}).addTo(map);}
</script></body></html>
