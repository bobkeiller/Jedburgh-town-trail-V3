<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jedburgh Town Trail</title><link rel="stylesheet" href="trail.css?v=9">
</head><body>
<header class="topbar trail-brand"><img src="../Jedburgh_Town_Trail_Assets/created%20graphics/Jed-icon-192.png" alt=""><h1>Jedburgh Town Trail</h1><a href="map.html">Map</a></header>
<main class="shell">
  <div class="experience-strip"><span>Your experience: <strong id="experienceName"></strong></span><button type="button" class="trail-options-button" data-trail-options>Trail options</button></div>
  <p class="hint locations-introduction" id="routeSummary"></p>
  <section class="collection-panel" id="plaqueProgressPanel" aria-labelledby="plaqueProgressTitle">
    <div class="collection-panel-head"><div><strong id="plaqueProgressTitle">Historic plaques</strong><span id="plaqueProgress">0 of 32 collected</span></div><button class="btn secondary collection-reset" id="resetPlaques" type="button">Reset plaques</button></div>
    <div class="progress-track" id="plaqueProgressTrack" role="progressbar" aria-labelledby="plaqueProgressTitle" aria-valuemin="0" aria-valuemax="32" aria-valuenow="0"><div class="progress-bar" id="plaqueProgressBar"></div></div>
    <p class="progress-complete" id="plaqueProgressComplete" hidden>🎉 All plaques collected — you've explored the whole trail!</p>
  </section>
  <p class="start-instruction"><strong>How to begin:</strong> Press <strong>Play</strong> to listen or select <strong>Welcome</strong> to read about the trail. Then select each numbered location as you follow the trail.</p>
  <div class="location-list" id="locationList"></div>
</main>
<script src="trail-data.js?v=7"></script><script src="trail-experience.js?v=2"></script><script src="trail-routes.js?v=1"></script><script src="trail-audio.js?v=4"></script><script src="trail-options.js?v=2"></script>
<script>
const experienceKey=TrailExperience.current(),experience=TrailExperience.modes[experienceKey],routePins=TrailRoutes.pinsForMode(experienceKey),plaques=Array.isArray(jedburghTrail.plaques)?jedburghTrail.plaques:[],plaqueStorageKey='jedburghTownTrail:plaques';
document.getElementById('experienceName').textContent=experience.name;
document.getElementById('routeSummary').textContent=`${experience.time} · Welcome, ${routePins.length} locations and Congratulations.`;
document.getElementById('plaqueProgressPanel').hidden=!experience.plaques;
const plaqueCounts=plaques.reduce((counts,plaque)=>{counts[plaque.locationId]=(counts[plaque.locationId]||0)+1;return counts;},{});
function specialCard(kind,title,subtitle,href,audioSrc){const audioButton=TrailAudio.enabled()?`<button type="button" class="btn secondary audio-btn compact-audio" data-act="audio" data-id="${kind}" data-audio="${encodeURIComponent(audioSrc)}" data-direction="" aria-label="Play audio for ${title}"><span class="btn-icon">🔊</span> <span class="audio-label">Play</span></button>`:'';return `<div class="location-card special-location-card"><span class="num" aria-hidden="true">${kind==='welcome'?'★':'✓'}</span><a class="location-link" href="${href}"><b>${title}</b><small>${subtitle}</small></a><div class="location-card-actions">${audioButton}<a class="special-card-arrow" href="${href}" aria-label="Open ${title}">→</a></div></div>`;}
const cards=routePins.map((pin,index)=>{const first=pin.content&&typeof pin.content[0]==='string'?pin.content[0].replace(/^#\s*/,'').slice(0,60):'',plaqueLine=experience.plaques&&plaqueCounts[pin.id]?`${plaqueCounts[pin.id]} historic plaque${plaqueCounts[pin.id]===1?'':'s'}`:'',subtitle=[first,plaqueLine].filter(Boolean).join(' · ')||'Tap to view',audioSrc=TrailAudio.sourceFor(pin),directionSrc=TrailAudio.directionSourceFor(pin,experienceKey),audioButton=TrailAudio.enabled()?`<button type="button" class="btn secondary audio-btn compact-audio" data-act="audio" data-id="${pin.id}" data-audio="${encodeURIComponent(audioSrc)}" data-direction="${encodeURIComponent(directionSrc)}" aria-label="Play audio for ${pin.name}"><span class="btn-icon">🔊</span> <span class="audio-label">Play</span></button>`:'';return `<div class="location-card" data-id="${pin.id}"><span class="num">${index+1}</span><a class="location-link" href="location.html?id=${encodeURIComponent(pin.id)}"><b>${pin.name}</b><small>${subtitle}</small></a><div class="location-card-actions">${audioButton}<button type="button" class="btn accent compact-find" data-act="find">🚶 Find</button></div></div>`;}).join('');
document.getElementById('locationList').innerHTML=specialCard('welcome','Welcome',`Start at ${TrailRoutes.welcomePin(experienceKey).name}`,'index.html',TrailAudio.DEFAULT_AUDIO)+cards+specialCard('congratulations','Congratulations',`Finish at ${TrailRoutes.congratulationsPin(experienceKey).name}`,'congratulations.html',TrailAudio.sourceFor({id:'time-for-reflection'}));
function navigateTo(pin){const apple=/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);location.href=apple?`https://maps.apple.com/?daddr=${pin.lat},${pin.lng}&dirflg=w`:`https://www.google.com/maps/dir/?api=1&destination=${pin.lat},${pin.lng}&travelmode=walking`;}
document.querySelectorAll('.location-card[data-id]').forEach(card=>{const pin=routePins.find(item=>item.id===card.dataset.id);card.querySelector('[data-act="find"]').addEventListener('click',()=>navigateTo(pin));});
const audioPlayer=new Audio();let activeButton=null,activeLocationId='',narrationSrc='',directionSrc='',audioPhase='narration';audioPlayer.preload='auto';
function renderAudioButton(){document.querySelectorAll('[data-act="audio"]').forEach(button=>{const active=button===activeButton&&!audioPlayer.paused;button.classList.toggle('is-playing',active);button.querySelector('.btn-icon').textContent=active?'⏸':(button===activeButton&&audioPhase==='directions'?'➜':'🔊');button.querySelector('.audio-label').textContent=active?(audioPhase==='directions'?'Directions':'Pause'):(button===activeButton&&audioPlayer.currentTime>0?'Resume':'Play');});}
document.querySelectorAll('[data-act="audio"]').forEach(button=>button.addEventListener('click',async()=>{if(button===activeButton&&!audioPlayer.paused){audioPlayer.pause();TrailAudio.savePlayback({locationId:activeLocationId,src:audioPlayer.src,currentTime:audioPlayer.currentTime,playing:false});renderAudioButton();return;}if(button!==activeButton){audioPlayer.pause();activeButton=button;activeLocationId=button.dataset.id;narrationSrc=decodeURIComponent(button.dataset.audio);directionSrc=decodeURIComponent(button.dataset.direction||'');audioPhase='narration';audioPlayer.src=narrationSrc;audioPlayer.load();}try{await audioPlayer.play();TrailAudio.savePlayback({locationId:activeLocationId,src:audioPlayer.src,currentTime:audioPlayer.currentTime,playing:true});}catch(_){alert('Audio could not be played. Please check the recording and try again.');}renderAudioButton();}));
audioPlayer.addEventListener('ended',async()=>{if(audioPhase==='narration'&&directionSrc){audioPhase='directions';audioPlayer.src=directionSrc;audioPlayer.load();renderAudioButton();try{await audioPlayer.play();return;}catch(_){}}audioPhase='narration';audioPlayer.src=narrationSrc;audioPlayer.load();TrailAudio.clearPlayback();renderAudioButton();});
audioPlayer.addEventListener('timeupdate',()=>{if(activeLocationId)TrailAudio.savePlayback({locationId:activeLocationId,src:audioPlayer.src,currentTime:audioPlayer.currentTime,playing:!audioPlayer.paused});});
function readCollected(){try{return new Set(JSON.parse(localStorage.getItem(plaqueStorageKey)||'[]'));}catch(_){return new Set();}}
function updateProgress(){const collected=readCollected(),count=[...collected].filter(id=>plaques.some(plaque=>plaque.id===id)).length,percent=plaques.length?Math.round(count/plaques.length*100):0;document.getElementById('plaqueProgress').textContent=`${count} of ${plaques.length} collected (${percent}%)`;document.getElementById('plaqueProgressBar').style.width=`${percent}%`;document.getElementById('plaqueProgressTrack').setAttribute('aria-valuenow',count);document.getElementById('plaqueProgressComplete').hidden=count!==plaques.length;}
document.getElementById('resetPlaques').addEventListener('click',()=>{if(!confirm('Reset all collected plaques?'))return;localStorage.removeItem(plaqueStorageKey);updateProgress();});updateProgress();
</script></body></html>
